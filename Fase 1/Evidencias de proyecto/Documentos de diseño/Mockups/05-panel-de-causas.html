<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>LEX-CORPUS · Panel de causas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#EFE7D8;
    --paper-raised:#F8F2E6;
    --ink:#2E2118;
    --ink-soft:#6B5A48;
    --burgundy:#6B1F2A;
    --burgundy-deep:#4A121C;
    --gold:#A87C3F;
    --olive:#6E7A4A;
    --line:#D9CBAE;
    --focus:#8C2A36;
    --sidebar-w:250px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
  }
  svg.icon{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}

  /* ---- shell ---- */
  .shell{display:flex; min-height:100vh;}

  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 auto;
    background:var(--paper-raised);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .side-brand{
    font-family:"Libre Caslon Text", Georgia, serif;
    font-size:19px;
    letter-spacing:0.02em;
    color:var(--ink);
    padding:4px 8px 20px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .side-brand .dot{color:var(--burgundy);}
  .side-role{
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:0 8px 14px;
  }
  .side-group-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:16px 8px 8px;
  }
  .side-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:7px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border:none;
    background:none;
    width:100%;
    text-align:left;
    font-family:inherit;
  }
  .side-link:hover{background:var(--paper);}
  .side-link.active{background:var(--burgundy); color:#F5E9DD;}
  .side-link .badge{
    margin-left:auto;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    background:var(--gold);
    color:#3B2A16;
    padding:1px 6px;
    border-radius:10px;
  }
  .side-link.active .badge{background:#F5E9DD; color:var(--burgundy);}

  .sidebar-foot{margin-top:auto; border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:2px;}

  .sidebar-close{display:none;}

  /* ---- topbar ---- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px clamp(16px,3vw,28px);
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .hamburger{
    display:none;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:7px;
    cursor:pointer;
    color:var(--ink);
  }
  .breadcrumb{font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .breadcrumb strong{color:var(--ink); font-weight:600;}
  .user-chip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink);}
  .user-chip .av{
    width:28px; height:28px; border-radius:50%; background:var(--burgundy); color:#F5E9DD;
    display:flex; align-items:center; justify-content:center; font-family:"Libre Caslon Text", serif; font-size:12px;
  }

  /* ---- content ---- */
  .page{padding:clamp(18px,3vw,32px); max-width:1180px; width:100%; margin:0 auto;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-head h1{
    font-family:"Libre Caslon Text", Georgia, serif; font-weight:400;
    font-size:clamp(22px,2.8vw,28px); margin:0 0 4px;
  }
  .page-head p{margin:0; color:var(--ink-soft); font-size:14px;}
  .btn-primary{
    background:var(--burgundy); color:#F5E9DD; border:none; border-radius:6px;
    padding:10px 16px; font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn-primary:hover{background:var(--burgundy-deep);}
  .btn-primary:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* ---- toolbar ---- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .seg-toggle{display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; background:var(--paper); flex:0 0 auto;}
  .seg-toggle button{border:none; background:none; font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; cursor:pointer; color:var(--ink-soft);}
  .seg-toggle button.active{background:var(--burgundy); color:#F5E9DD;}

  .search-wrap{position:relative; flex:1 1 200px; min-width:160px;}
  .search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-soft);}
  .search-wrap input{
    width:100%; padding:8px 10px 8px 32px; border:1px solid var(--line); border-radius:7px;
    background:var(--paper); font-family:inherit; font-size:13.5px; color:var(--ink);
  }
  .search-wrap input:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}

  select{
    border:1px solid var(--line); border-radius:7px; background:var(--paper);
    color:var(--ink); font-family:inherit; font-size:13.5px; padding:8px 10px;
    flex:0 0 auto;
  }
  select:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}

  .toolbar-right{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;}

  /* ---- table ---- */
  .table-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:820px;}
  thead th{
    text-align:left; font-size:11.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-soft); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:13px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--paper);}
  .mono{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--ink-soft);}
  .cliente-name{font-weight:600;}

  .prio{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;}
  .prio .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .prio.alta .dot{background:var(--burgundy);}
  .prio.alta{color:var(--burgundy);}
  .prio.media .dot{background:var(--gold);}
  .prio.media{color:#8a6a30;}
  .prio.baja .dot{background:var(--olive);}
  .prio.baja{color:var(--olive);}

  .muted{color:var(--ink-soft);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:6px;
    cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{color:var(--burgundy); border-color:var(--burgundy);}
  .icon-btn:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}

  .empty-row td{text-align:center; padding:34px 14px; color:var(--ink-soft); font-size:13.5px;}

  .caption{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    font-size:12.5px; color:var(--ink-soft); border-top:1px solid var(--line);
  }

  /* ---- toast ---- */
  .toast{
    position:fixed; left:20px; bottom:20px; background:var(--ink); color:var(--paper);
    padding:11px 16px; border-radius:7px; font-size:13px; max-width:340px; line-height:1.4;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    transform:translateY(12px); opacity:0; transition:all .2s ease; pointer-events:none; z-index:20;
  }
  .toast.show{transform:translateY(0); opacity:1;}

  .demo-note{
    position:fixed; bottom:14px; right:14px; background:var(--ink); color:var(--paper);
    font-size:11.5px; padding:6px 10px; border-radius:5px; opacity:0.75;
    font-family:"IBM Plex Mono", monospace; z-index:15;
  }

  @media (max-width:900px){
    .sidebar{
      position:fixed; left:0; top:0; z-index:30; transform:translateX(-100%);
      transition:transform .2s ease; box-shadow:0 0 0 100vmax rgba(0,0,0,0);
    }
    .sidebar.open{transform:translateX(0); box-shadow:0 0 0 100vmax rgba(46,33,24,0.35);}
    .hamburger{display:inline-flex;}
    .sidebar-close{
      display:inline-flex; margin-left:auto; border:none; background:none; color:var(--ink-soft);
      font-size:13px; cursor:pointer; padding:4px 8px;
    }
  }
  @media (max-width:600px){
    table{min-width:720px;}
    .toolbar-right{margin-left:0; width:100%;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div style="display:flex; align-items:center;">
      <div class="side-brand">LEX<span class="dot">·</span>CORPUS</div>
      <button class="sidebar-close" id="sidebarClose">Cerrar ✕</button>
    </div>
    <div class="side-role">Vista de Abogado</div>

    <nav>
      <div class="side-group-label">Causas</div>
      <button class="side-link active">
        <svg class="icon" viewBox="0 0 20 20"><path d="M2.5 6.5c0-1.1.9-2 2-2h3l1.5 2h6.5c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2h-11c-1.1 0-2-.9-2-2v-8Z"/></svg>
        Panel de causas
        <span class="badge">10</span>
      </button>
      <button class="side-link">
        <svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2"/><path d="M10 6v4l2.6 2"/></svg>
        Ver pendientes
      </button>

      <div class="side-group-label">Herramientas</div>
      <button class="side-link">
        <svg class="icon" viewBox="0 0 20 20"><path d="M10 3v9M6.5 6.5 10 3l3.5 3.5"/><path d="M3.5 13v2.5c0 .8.7 1.5 1.5 1.5h10c.8 0 1.5-.7 1.5-1.5V13"/></svg>
        Importar desde Excel
      </button>
      <button class="side-link">
        <svg class="icon" viewBox="0 0 20 20"><path d="M3 6.5c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2v7c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2v-7Z"/><path d="M3 7.5l5.2 3.6c.5.35 1.1.35 1.6 0L15 7.5"/></svg>
        Bandeja por confirmar
        <span class="badge">3</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="side-link">
        <svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3"/><path d="M4 16.5c0-2.8 2.7-4.5 6-4.5s6 1.7 6 4.5"/></svg>
        Mi perfil
      </button>
      <button class="side-link">
        <svg class="icon" viewBox="0 0 20 20"><path d="M8 3H5.5c-.8 0-1.5.7-1.5 1.5v11c0 .8.7 1.5 1.5 1.5H8"/><path d="M13 14l3.5-4L13 6M16 10H8"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú">
          <svg class="icon" viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <span class="breadcrumb">Causas / <strong>Panel de causas</strong></span>
      </div>
      <div class="user-chip">
        <span class="av">EJ</span>
        Emerson Jiménez
      </div>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1>Panel de causas</h1>
          <p id="summaryLine">10 causas · 7 activas · 3 archivadas</p>
        </div>
        <button class="btn-primary" id="newCausaBtn">
          <svg class="icon" viewBox="0 0 20 20" stroke="#F5E9DD"><path d="M10 4v12M4 10h12"/></svg>
          Nueva causa
        </button>
      </div>

      <div class="toolbar">
        <div class="seg-toggle" id="viewToggle">
          <button class="active" data-view="activas">Activas</button>
          <button data-view="archivadas">Archivadas</button>
        </div>

        <div class="search-wrap">
          <svg class="icon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M16 16l-3.2-3.2"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por cliente, referencia o RIT…" />
        </div>

        <select id="filterPrioridad">
          <option value="">Prioridad: todas</option>
          <option value="Alta">Prioridad: Alta</option>
          <option value="Media">Prioridad: Media</option>
          <option value="Baja">Prioridad: Baja</option>
        </select>

        <select id="filterMateria">
          <option value="">Materia: todas</option>
          <option value="Familia">Familia</option>
          <option value="Laboral">Laboral</option>
          <option value="Civil">Civil</option>
          <option value="Penal">Penal</option>
        </select>

        <select id="sortBy">
          <option value="prioridad_desc">Ordenar: prioridad (alta→baja)</option>
          <option value="prioridad_asc">Ordenar: prioridad (baja→alta)</option>
          <option value="cliente_asc">Ordenar: cliente (A–Z)</option>
          <option value="fecha_asc">Ordenar: próxima fecha</option>
        </select>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Prioridad</th>
                <th>Referencia</th>
                <th>RIT</th>
                <th>Cliente</th>
                <th>Materia</th>
                <th>Tribunal</th>
                <th>Próxima fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="caption" id="caption"></div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="demo-note">Mockup 05/13 · Panel de causas</div>

<script>
  const CAUSAS = [
    {id:'LC-0142', rit:'C-2481-2025', cliente:'María Elena Contreras Soto', materia:'Familia', detalle:'Pensión de alimentos', tribunal:'1° Juzgado de Familia de Santiago', prioridad:'Alta', proxima:'2026-09-18', proximaLabel:'Audiencia · 18-09-2026', archivada:false},
    {id:'LC-0233', rit:'C-1650-2025', cliente:'Andrés Reyes Cárcamo', materia:'Laboral', detalle:'Cobro de finiquito', tribunal:'Juz. de Letras del Trabajo de Santiago', prioridad:'Alta', proxima:'2026-09-12', proximaLabel:'Audiencia · 12-09-2026', archivada:false},
    {id:'LC-0098', rit:'C-1097-2025', cliente:'Jorge Salinas Muñoz', materia:'Laboral', detalle:'Despido injustificado', tribunal:'Juz. de Letras del Trabajo de Santiago', prioridad:'Media', proxima:'2026-09-12', proximaLabel:'Plazo contestación · 12-09-2026', archivada:false},
    {id:'LC-0176', rit:'C-0774-2026', cliente:'Pedro Vidal Ortega', materia:'Familia', detalle:'Divorcio de mutuo acuerdo', tribunal:'3° Juzgado de Familia de Santiago', prioridad:'Media', proxima:'2026-09-25', proximaLabel:'Audiencia · 25-09-2026', archivada:false},
    {id:'LC-0159', rit:'C-2984-2025', cliente:'Teresa Muñoz Ríos', materia:'Penal', detalle:'Querella por lesiones', tribunal:'7° Juzgado de Garantía de Santiago', prioridad:'Media', proxima:null, proximaLabel:null, archivada:false},
    {id:'LC-0201', rit:'C-3320-2024', cliente:'Rosa Elgueta Paredes', materia:'Civil', detalle:'Arriendo, término de contrato', tribunal:'2° Juzgado Civil de San Miguel', prioridad:'Baja', proxima:null, proximaLabel:null, archivada:false},
    {id:'LC-0087', rit:'C-4410-2024', cliente:'Camila Fuentes Vera', materia:'Civil', detalle:'Cobro de pesos', tribunal:'1° Juzgado Civil de Santiago', prioridad:'Baja', proxima:null, proximaLabel:null, archivada:false},
    {id:'LC-0033', rit:'C-2210-2024', cliente:'Manuel Soto Bravo', materia:'Penal', detalle:'Falta', tribunal:'7° Juzgado de Garantía de Santiago', prioridad:'Baja', proxima:null, proximaLabel:'Cerrada · 15-01-2026', archivada:true},
    {id:'LC-0011', rit:'C-0456-2023', cliente:'Bernardita Rojas Fernández', materia:'Civil', detalle:'Cobro de pesos', tribunal:'1° Juzgado Civil de Santiago', prioridad:'Baja', proxima:null, proximaLabel:'Cerrada · 20-11-2025', archivada:true},
    {id:'LC-0055', rit:'C-1893-2024', cliente:'Luis Contreras Díaz', materia:'Laboral', detalle:'Despido', tribunal:'Juz. de Letras del Trabajo de Santiago', prioridad:'Media', proxima:null, proximaLabel:'Cerrada · 02-03-2026', archivada:true},
  ];

  const PRIO_RANK = {Alta:3, Media:2, Baja:1};
  const state = {view:'activas', prioridad:'', materia:'', sort:'prioridad_desc', query:''};

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTable(){
    let rows = CAUSAS.filter(c => c.archivada === (state.view === 'archivadas'));
    if(state.prioridad) rows = rows.filter(c => c.prioridad === state.prioridad);
    if(state.materia) rows = rows.filter(c => c.materia === state.materia);
    if(state.query){
      const q = state.query.toLowerCase();
      rows = rows.filter(c => c.cliente.toLowerCase().includes(q) || c.id.toLowerCase().includes(q) || c.rit.toLowerCase().includes(q));
    }

    rows.sort((a,b) => {
      if(state.sort === 'prioridad_desc') return PRIO_RANK[b.prioridad]-PRIO_RANK[a.prioridad];
      if(state.sort === 'prioridad_asc') return PRIO_RANK[a.prioridad]-PRIO_RANK[b.prioridad];
      if(state.sort === 'cliente_asc') return a.cliente.localeCompare(b.cliente);
      if(state.sort === 'fecha_asc'){
        if(!a.proxima && !b.proxima) return 0;
        if(!a.proxima) return 1;
        if(!b.proxima) return -1;
        return a.proxima.localeCompare(b.proxima);
      }
      return 0;
    });

    const tbody = document.getElementById('tableBody');
    if(rows.length === 0){
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No encontramos causas con estos filtros. Ajusta la búsqueda o los filtros seleccionados.</td></tr>';
    } else {
      tbody.innerHTML = rows.map(c => `
        <tr data-id="${c.id}">
          <td><span class="prio ${c.prioridad.toLowerCase()}"><span class="dot"></span>${c.prioridad}</span></td>
          <td class="mono">${c.id}</td>
          <td class="mono">${c.rit}</td>
          <td><span class="cliente-name">${escapeHtml(c.cliente)}</span></td>
          <td>${c.materia}<br><span class="muted" style="font-size:12px;">${escapeHtml(c.detalle)}</span></td>
          <td class="muted">${escapeHtml(c.tribunal)}</td>
          <td class="${c.proximaLabel ? '' : 'muted'}">${c.proximaLabel || '—'}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-action="view" title="Ver detalle" aria-label="Ver detalle de ${c.id}">
                <svg class="icon" viewBox="0 0 20 20"><path d="M2 10s2.8-5.5 8-5.5S18 10 18 10s-2.8 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2"/></svg>
              </button>
              <button class="icon-btn" data-action="edit" title="Editar" aria-label="Editar ${c.id}">
                <svg class="icon" viewBox="0 0 20 20"><path d="M12.5 3.5l3 3L6 16l-3.6.6L3 13l9.5-9.5Z"/></svg>
              </button>
              <button class="icon-btn" data-action="archive" title="${c.archivada ? 'Restaurar' : 'Archivar'}" aria-label="${c.archivada ? 'Restaurar' : 'Archivar'} ${c.id}">
                <svg class="icon" viewBox="0 0 20 20"><path d="M3 5.5c0-.8.7-1.5 1.5-1.5h11c.8 0 1.5.7 1.5 1.5V7H3V5.5Z"/><path d="M4 7v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7"/><path d="M8 10.5h4"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    const total = CAUSAS.length;
    const activas = CAUSAS.filter(c => !c.archivada).length;
    const archivadas = total - activas;
    document.getElementById('summaryLine').textContent = `${total} causas · ${activas} activas · ${archivadas} archivadas`;
    document.getElementById('caption').textContent = `Mostrando ${rows.length} de ${CAUSAS.filter(c => c.archivada === (state.view==='archivadas')).length} ${state.view === 'archivadas' ? 'causas archivadas' : 'causas activas'}`;
  }

  document.getElementById('viewToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if(!btn) return;
    state.view = btn.dataset.view;
    document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b === btn));
    renderTable();
  });
  document.getElementById('filterPrioridad').addEventListener('change', e => { state.prioridad = e.target.value; renderTable(); });
  document.getElementById('filterMateria').addEventListener('change', e => { state.materia = e.target.value; renderTable(); });
  document.getElementById('sortBy').addEventListener('change', e => { state.sort = e.target.value; renderTable(); });
  document.getElementById('searchInput').addEventListener('input', e => { state.query = e.target.value; renderTable(); });

  let toastTimer;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.getElementById('tableBody').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if(!tr) return;
    const id = tr.dataset.id;
    const actionBtn = e.target.closest('button[data-action]');

    if(actionBtn && actionBtn.dataset.action === 'archive'){
      const c = CAUSAS.find(c => c.id === id);
      c.archivada = !c.archivada;
      showToast(`Causa ${id} ${c.archivada ? 'archivada' : 'restaurada a activas'}.`);
      renderTable();
      return;
    }
    if(actionBtn && actionBtn.dataset.action === 'edit'){
      showToast(`Esto abre "Registrar / Editar causa" con los datos de ${id} — mockup 06.`);
      return;
    }
    showToast(`Esto abre "Detalle de causa" de ${id} — mockup 07.`);
  });

  document.getElementById('newCausaBtn').addEventListener('click', () => {
    showToast('Esto abre el formulario "Registrar / Editar causa" — mockup 06.');
  });

  const sidebar = document.getElementById('sidebar');
  document.getElementById('hamburgerBtn').addEventListener('click', () => sidebar.classList.add('open'));
  document.getElementById('sidebarClose').addEventListener('click', () => sidebar.classList.remove('open'));

  renderTable();
</script>

</body>
</html>
